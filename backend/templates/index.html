<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Design Insight Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/vis-network/styles/vis-network.css" rel="stylesheet">
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f7f6fb;
      margin: 0;
      padding: 0;
    }
    .topbar {
      background-color: #6a4fa3;
      color: white;
      padding: 1rem 2rem;
      font-size: 1.5rem;
      font-weight: bold;
    }
    .method-button {
      background-color: #c2b2e1;
      color: #4e3c73;
      margin: 6px 6px 6px 0;
      padding: 6px 14px;
      border: none;
      border-radius: 20px;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(100, 100, 111, 0.15);
      transition: background-color 0.3s ease;
    }

    .method-button:hover {  
      background-color: #b29cd9;
    }
    .similar-buttons-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.07);
    }
    .chat {
      max-height: 500px;
      overflow-y: auto;
      margin-bottom: 1rem;
      padding-right: 10px;
    }
    .chat-message {
      margin: 12px 0;
      padding: 14px 20px;
      border-radius: 20px;
      max-width: 80%;
      line-height: 1.6;
      animation: fadeIn 0.3s ease-in-out;
    }
    .user {
      background-color: #e7dcf9;
      align-self: flex-end;
      margin-left: auto;
    }
    .bot {
      background-color: #f2edf9;
      align-self: flex-start;
      margin-right: auto;
    }
    .input-area {
      display: flex;
      margin-top: 1rem;
    }
    input[type="text"] {
      flex-grow: 1;
      padding: 14px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #a287c4;
      color: white;
      font-weight: bold;
      padding: 14px 18px;
      border: none;
      border-radius: 10px;
      margin-left: 10px;
      cursor: pointer;
    }
    button:hover {
      background-color: #8b6ab2;
    }
    .tags {
      margin-top: 1rem;
      text-align: center;
    }
    .tags button {
      background-color: #ece5f5;
      color: #4e3c73;
      font-weight: 500;
      margin: 6px;
      border: none;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
    }
    .tags button:hover {
      background-color: #d7c9eb;
    }
    .method-card {
      background-color: #f8f5fc;
      border-left: 5px solid #a287c4;
      padding: 20px;
      border-radius: 12px;
      margin: 15px 0;
    }
    .graph-button {
      display: block;
      background-color: #a287c4;
      color: white;
      padding: 12px 20px;
      margin: 20px auto 10px auto;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      text-align: center;
      transition: background-color 0.3s ease;
    }
    .graph-button:hover {
      background-color: #8b6ab2;
    }
    .feedback-block {
      margin-top: 16px;
      background-color: #f4f1fa;
      padding: 12px;
      border-radius: 10px;
    }
    .feedback-btn {
      background-color: #d1c4e9;
      color: #4e3c73;
      margin: 6px;
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
    }
    .feedback-btn:hover {
      background-color: #b39ddb;
    }
    #method-graph-modal {
    position: fixed;
    top: 8%;
    left: 50%;
    transform: translate(-50%, 0);
    width: 80%;
    height: 75%;
    background: #fffafc;
    border: 2px solid #d7c9eb;
    border-radius: 20px;
    box-shadow: 0 12px 32px rgba(103, 80, 164, 0.2);
    z-index: 9999;
    padding: 20px;
    display: none;
    overflow: hidden;
  }

  #network {
    height: calc(100% - 60px); /* leave space for button */
    margin-bottom: 10px;
  }

  .close-button-container {
    text-align: center;
    margin-top: 10px;
  }

  .graph-button.close {
    background-color: #a287c4;
    padding: 10px 24px;
    font-size: 14px;
    border-radius: 10px;
    color: white;
    border: none;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

.graph-button.close:hover {
  background-color: #8b6ab2;
}

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="topbar">Design Insight Assistant</div>
  <div class="container">
    <div class="chat" id="chatBox">
      <div class="chat-message bot">Welcome! Ask about any design method (e.g., “Delphi Method”) or click a phase below.</div>
    </div>
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Ask about a method or phase...">
      <button onclick="sendMessage()">Send</button>
    </div>
    <div class="tags">
      <button onclick="sendTag('problem_framing')">Problem Framing</button>
      <button onclick="sendTag('implementation')">Implementation</button>
      <button onclick="sendTag('evaluation')">Evaluation</button>
      <button onclick="sendTag('conclusion')">Conclusion</button>
      <button onclick="sendTag('all')">All Methods</button>
    </div>
  </div>

  <div id="method-graph-modal">
    <div id="network"></div>
    <div class="close-button-container">
  <button class="graph-button close" onclick="closeModal()">Close</button>
</div>

  </div>

  <script>
    function appendMessage(text, sender) {
      const chatBox = document.getElementById("chatBox");
      const div = document.createElement("div");
      div.className = "chat-message " + sender;
      div.innerHTML = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;

      // Attach to all visualize buttons inside this message
      const visButtons = div.querySelectorAll(".graph-button[data-method]");
      visButtons.forEach(btn => {
        btn.onclick = () => {
          const method = btn.dataset.method;
          const similar = JSON.parse(btn.dataset.similar);
          showRadialMindMap(method, similar);
        };
      });

      const toggles = div.querySelectorAll('.expand-toggle');
      toggles.forEach(toggle => {
        toggle.onclick = () => toggleExpand(toggle);
      });

      const innerToggles = div.querySelectorAll('.second-expand-toggle');
      innerToggles.forEach(toggle => {
        toggle.onclick = () => toggleInnerExpand(toggle);
      });
    }

    function sendMessage() {
      const input = document.getElementById("userInput");
      const message = input.value.trim();
      if (!message) return;
      appendMessage(message, "user");
      fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message })
      })
      .then(res => res.json())
      .then(data => appendMessage(data.reply, "bot"));
      input.value = "";
    }

    function sendTag(phase) {
      appendMessage(phase.replace("_", " "), "user");
      fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: phase })
      })
      .then(res => res.json())
      .then(data => appendMessage(data.reply, "bot"));
    }

    function sendMethod(title) {
      appendMessage(title, "user");
      fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: title })
      })
      .then(res => res.json())
      .then(data => appendMessage(data.reply, "bot"));
    }

    function closeModal() {
      document.getElementById("method-graph-modal").style.display = "none";
    }

    function showRadialMindMap(methodTitle, similar) {
  // Limit to top 6 methods for clarity
  const topSimilar = similar.slice(0, 6);

  const nodes = [{
    id: 1,
    label: methodTitle,
    color: "#8e44ad",
    font: { size: 18, color: '#fff' }
  }];

  const edges = [];
  let nodeId = 2;

  topSimilar.forEach(sim => {
    nodes.push({
      id: nodeId,
      label: sim.title,
      color: sim.score > 0.6 ? "#e1bee7" : sim.score > 0.5 ? "#d1c4e9" : "#ede7f6",
      font: { size: 14, color: "#333" },
      title: `Click to explore: ${sim.title}`
    });
    edges.push({
      from: 1,
      to: nodeId,
      label: `sim: ${sim.score.toFixed(2)}`,
      arrows: 'to',
      width: Math.max(1, sim.score * 8),
      font: { align: 'middle', size: 12, color: '#555' },
      color: { color: '#888', highlight: '#333' }
    });
    nodeId++;
  });

  const container = document.getElementById("network");
  const data = {
    nodes: new vis.DataSet(nodes),
    edges: new vis.DataSet(edges)
  };

  const options = {
    layout: { hierarchical: false },
    physics: {
      enabled: true,
      barnesHut: {
        gravitationalConstant: -2500,
        centralGravity: 0.2,
        springLength: 240,
        damping: 0.8
      }
    },
    nodes: { shape: 'dot', size: 20, borderWidth: 2 },
    edges: { smooth: true },
    interaction: { hover: true, zoomView: true, dragNodes: true }
  };

  const network = new vis.Network(container, data, options);

  // Enable node click to explore the selected method
 network.on("click", function (params) {
  const nodeId = params.nodes[0];
  if (nodeId && nodeId !== 1) {
    const clickedNode = nodes.find(n => n.id === nodeId);
    if (clickedNode && clickedNode.label) {
      // Zoom into the clicked node before navigating
      network.focus(nodeId, {
        scale: 1.5,
        animation: {
          duration: 500,
          easingFunction: "easeInOutQuad"
        }
      });

      // Delay the method switch slightly so user sees animation
      setTimeout(() => {
        closeModal();
        sendMethod(clickedNode.label.trim());
      }, 600);
    }
  }
});


  document.getElementById("method-graph-modal").style.display = "block";
}


    function toggleExpand(el) {
      const content = el.nextElementSibling;
      content.style.display = content.style.display === "block" ? "none" : "block";
      el.textContent = content.style.display === "block" ? "Hide steps" : "Learn more...";
    }

    function toggleInnerExpand(el) {
      const details = el.nextElementSibling;
      details.style.display = details.style.display === "block" ? "none" : "block";
      el.textContent = details.style.display === "block" ? "Hide extra info" : "More info...";
    }
  </script>
</body>
</html>
